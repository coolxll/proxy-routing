# SublinkPro routing.yaml - 标准规则生成模板
# __ALL_PROXIES__ 由 SublinkPro 在生成订阅时填充。

port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: :9090

dns:
  enabled: true
  nameserver:
    - 119.29.29.29
    - 223.5.5.5
  fallback:
    - 8.8.8.8
    - 8.8.4.4
    - tls://1.0.0.1:853
    - tls://dns.google:853

proxies: ~

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
      - __ALL_PROXIES__

  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - __ALL_PROXIES__

  - name: Google
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - __ALL_PROXIES__

  - name: 🤖 AI
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - __ALL_PROXIES__

  - name: Ⓜ️ Microsoft
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - __ALL_PROXIES__

  - name: 📦 GitHub
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - __ALL_PROXIES__

  - name: ⬇️ 大流量
    type: select
    proxies:
      - ♻️ 自动选择
      - 🚀 节点选择
      - DIRECT
      - __ALL_PROXIES__

  - name: 🪟 Windows 更新
    type: select
    proxies:
      - DIRECT
      - ⬇️ 大流量
      - 🚀 节点选择
      - __ALL_PROXIES__

  - name: ✈️ Telegram
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - __ALL_PROXIES__

  - name: 🌐 代理
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - __ALL_PROXIES__

  - name: 🎯 直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - __ALL_PROXIES__

  - name: 🛑 拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🇯🇵 日本
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    filter: (日本|Japan|JP|东京|大阪)
    proxies:

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 直连
      - ♻️ 自动选择
      - __ALL_PROXIES__

rules:
  - RULE-SET,private,🎯 直连
  - GEOSITE,category-ads-all,🛑 拦截
  - RULE-SET,windows-update,🪟 Windows 更新
  - RULE-SET,traffic-heavy,⬇️ 大流量
  - RULE-SET,google,Google
  - RULE-SET,ai,🤖 AI
  - RULE-SET,microsoft,Ⓜ️ Microsoft
  - RULE-SET,github,📦 GitHub
  - RULE-SET,telegram,✈️ Telegram
  - RULE-SET,bank,🎯 直连
  - RULE-SET,travel-direct,🎯 直连
  - RULE-SET,dmm,🇯🇵 日本
  - RULE-SET,direct,🎯 直连
  - RULE-SET,proxy,🌐 代理
  - GEOSITE,cn,🎯 直连
  - GEOSITE,geolocation-!cn,🌐 代理
  - GEOIP,CN,🎯 直连
  - MATCH,🐟 漏网之鱼

rule-providers:
  private:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/private.list
    path: ./providers/private.txt
    interval: 86400

