# SublinkPro routing.yaml - 标准规则生成模板
# __ALL_PROXIES__ 由 SublinkPro 在生成订阅时填充。

port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: :9090
ipv6: false

dns:
  enable: true
  ipv6: false
  nameserver:
    - 119.29.29.29
    - 223.5.5.5
  fallback:
    - 8.8.8.8
    - 8.8.4.4
    - tls://1.0.0.1:853
    - tls://dns.google:853
  direct-nameserver:
    - system
  direct-nameserver-follow-policy: true
  nameserver-policy:
    "+.229929605.xyz":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "+.bytecloudapp.com":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "+.ts.net":
      - 100.100.100.100
    "geosite:private":
      - system
    "geosite:cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
  fake-ip-filter:
    - "+.229929605.xyz"
    - "+.bytecloudapp.com"
    - "geosite:private"
    - "localhost"
    - "+.local"
    - "+.tailscale.com"
    - "+.ts.net"

proxies: ~

proxy-groups:
  - name: 🏢 公司内网
    type: select
    proxies:
      - corp172-proxy
      - DIRECT

  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
      - __ALL_PROXIES__

  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    exclude-filter: "(?i)(Home-Shanghai|corp172|上海|内网)"
    proxies:

  - name: Google
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - __ALL_PROXIES__

  - name: 🤖 AI
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - __ALL_PROXIES__

  - name: ⬇️ 大流量
    type: select
    proxies:
      - ♻️ 自动选择
      - 🚀 节点选择
      - DIRECT
      - __ALL_PROXIES__

  - name: 🇯🇵 日本
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    filter: (日本|Japan|JP|东京|大阪)
    proxies:

rules:
  # 公司内网与业务域名（优先于 private 直连，默认走 corp172 远端代理直连）
  - IP-CIDR,10.0.0.0/8,🏢 公司内网,no-resolve
  - DOMAIN-SUFFIX,dongfangfuli.com,🏢 公司内网
  - DOMAIN-SUFFIX,psf-dev.com,🏢 公司内网
  - DOMAIN-SUFFIX,ocjfuli.com,🏢 公司内网

  - RULE-SET,private,DIRECT
  - RULE-SET,unban,DIRECT
  - GEOSITE,category-ads-all,REJECT
  - RULE-SET,download,DIRECT
  - RULE-SET,windows-update,DIRECT
  - RULE-SET,traffic-heavy,⬇️ 大流量
  - RULE-SET,google,Google
  - RULE-SET,ai,🤖 AI
  - RULE-SET,microsoft,🚀 节点选择
  - RULE-SET,github,🚀 节点选择
  - RULE-SET,telegram,🚀 节点选择
  - RULE-SET,bank,DIRECT
  - RULE-SET,travel-direct,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,dmm,🇯🇵 日本
  - RULE-SET,direct,DIRECT
  - RULE-SET,proxy,🚀 节点选择
  - GEOSITE,cn,DIRECT
  - GEOSITE,geolocation-!cn,🚀 节点选择
  - GEOIP,CN,DIRECT
  - MATCH,🚀 节点选择

