# Shadowrocket 2.2.89+ with the built-in global Tailscale tunnel.
# Add proxy nodes through the existing subscription, then select this configuration.

[General]
loglevel = notify
bypass-system = true
dns-server = system,119.29.29.29,223.5.5.5
ipv6 = true
test-timeout = 5

[Proxy]
DIRECT = direct

[Proxy Group]
🚀 节点选择 = select, ♻️ 自动选择, DIRECT, include-all-proxies=1
♻️ 自动选择 = url-test, url=http://www.gstatic.com/generate_204, interval=300, timeout=5, tolerance=50, include-all-proxies=1

Google = select, 🚀 节点选择, ♻️ 自动选择, DIRECT, include-all-proxies=1
🤖 AI = select, 🚀 节点选择, ♻️ 自动选择, DIRECT, include-all-proxies=1
Ⓜ️ Microsoft = select, 🚀 节点选择, ♻️ 自动选择, DIRECT, include-all-proxies=1
📦 GitHub = select, 🚀 节点选择, ♻️ 自动选择, DIRECT, include-all-proxies=1
⬇️ 大流量 = select, ♻️ 自动选择, 🚀 节点选择, DIRECT, include-all-proxies=1
🪟 Windows 更新 = select, DIRECT, ⬇️ 大流量, 🚀 节点选择, include-all-proxies=1
✈️ Telegram = select, 🚀 节点选择, ♻️ 自动选择, DIRECT, include-all-proxies=1
🏦 银行 = select, DIRECT, 🚀 节点选择, include-all-proxies=1
🌐 代理 = select, 🚀 节点选择, ♻️ 自动选择, include-all-proxies=1
🎯 直连 = select, DIRECT, 🚀 节点选择, include-all-proxies=1
🛑 拦截 = select, REJECT, DIRECT
🇯🇵 日本 = url-test, url=http://www.gstatic.com/generate_204, interval=300, timeout=5, tolerance=50, policy-regex-filter=日本|东京|大阪|JP|Japan, include-all-proxies=1
🐟 漏网之鱼 = select, 🚀 节点选择, 🎯 直连, ♻️ 自动选择, include-all-proxies=1

[Rule]
# Tailscale must precede private/direct rules. Do not put 100.64.0.0/10 in tun-excluded-routes.
DOMAIN-SUFFIX,ts.net,TAILSCALE
IP-CIDR,100.64.0.0/10,TAILSCALE,no-resolve
IP-CIDR6,fd7a:115c:a1e0::/48,TAILSCALE,no-resolve

# Add advertised subnet routes here, before private.list. Example:
# IP-CIDR,192.168.3.0/24,TAILSCALE,no-resolve

RULE-SET,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/private.list,🎯 直连,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list,🛑 拦截,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list,🛑 拦截,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/windows-update.list,🪟 Windows 更新,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/traffic-heavy.list,⬇️ 大流量,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/google.list,Google,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/ai.list,🤖 AI,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/microsoft.list,Ⓜ️ Microsoft,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/github.list,📦 GitHub,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/telegram.list,✈️ Telegram,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/bank.list,🏦 银行,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/dmm.list,🇯🇵 日本,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/direct.list,🎯 直连,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/proxy.list,🌐 代理,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list,🎯 直连,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list,🌐 代理,update-interval=86400
GEOIP,CN,🎯 直连
FINAL,🐟 漏网之鱼
