# ShellCrash 自定义配置模板 - 低 GeoSite 依赖版
# 可替换 ShellCrash 的 ACL4SSR 标准版模板。
# __ALL_PROXIES__ 由 ShellCrash / 订阅转换流程填充。

port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: :9090

dns:
  enabled: true
  nameserver:
    - 119.29.29.29
    - 223.5.5.5
  fallback:
    - 8.8.8.8
    - 8.8.4.4
    - tls://1.0.0.1:853
    - tls://dns.google:853

proxies: ~

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🚀 手动切换
      - DIRECT

  - name: 🚀 手动切换
    type: select
    proxies:
      - __ALL_PROXIES__

  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - __ALL_PROXIES__

  - name: Google
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - 🚀 手动切换
      - __ALL_PROXIES__

  - name: 🤖 AI
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - 🚀 手动切换
      - __ALL_PROXIES__

  - name: Ⓜ️ Microsoft
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - 🚀 手动切换
      - __ALL_PROXIES__

  - name: 📦 GitHub
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🚀 手动切换
      - __ALL_PROXIES__

  - name: ⬇️ 大流量
    type: select
    proxies:
      - ♻️ 自动选择
      - 🚀 节点选择
      - DIRECT
      - 🚀 手动切换
      - __ALL_PROXIES__

  - name: 🪟 Windows 更新
    type: select
    proxies:
      - DIRECT
      - ⬇️ 大流量
      - 🚀 节点选择
      - 🚀 手动切换
      - __ALL_PROXIES__

  - name: ✈️ Telegram
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🚀 手动切换
      - __ALL_PROXIES__

  - name: 🌐 代理
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🚀 手动切换
      - __ALL_PROXIES__

  - name: 🎯 直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - 🚀 手动切换

  - name: 🛑 拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🇯🇵 日本
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 60
    lazy: true
    proxies:
      - 日本01-Hy
      - 日本01

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 直连
      - ♻️ 自动选择
      - 🚀 手动切换
      - __ALL_PROXIES__

rules:
  # 局域网 / 私有地址
  - RULE-SET,private,🎯 直连

  # 广告 list，替代 GEOSITE,category-ads-all
  - RULE-SET,ad,🛑 拦截
  - RULE-SET,program-ad,🛑 拦截

  # 专用规则必须在通用 GeoSite / GeoIP 规则前
  - RULE-SET,windows-update,🪟 Windows 更新
  - RULE-SET,traffic-heavy,⬇️ 大流量
  - RULE-SET,google,Google
  - RULE-SET,ai,🤖 AI
  - RULE-SET,microsoft,Ⓜ️ Microsoft
  - RULE-SET,github,📦 GitHub
  - RULE-SET,telegram,✈️ Telegram
  - RULE-SET,bank,🎯 直连
  - RULE-SET,travel-direct,🎯 直连

  # DMM / FANZA
  - RULE-SET,dmm,🇯🇵 日本

  # 手工补充
  - RULE-SET,direct,🎯 直连
  - RULE-SET,proxy,🌐 代理

  # 中国域名和 IP 直连；其余流量交给 MATCH，完全不依赖 GeoSite
  - RULE-SET,cn-domain,🎯 直连
  - GEOIP,CN,🎯 直连
  - MATCH,🐟 漏网之鱼

rule-providers:
  private:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/private.list
