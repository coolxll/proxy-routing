# ShellCrash 自定义配置模板 - 低 GeoSite 依赖版
# 可替换 ShellCrash 的 ACL4SSR 标准版模板。
# __ALL_PROXIES__ 由 ShellCrash / 订阅转换流程填充。

port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: :9090
ipv6: false

dns:
  enabled: true
  ipv6: false
  nameserver:
    - 119.29.29.29
    - 223.5.5.5
  fallback:
    - 8.8.8.8
    - 8.8.4.4
    - tls://1.0.0.1:853
    - tls://dns.google:853
  fake-ip-filter:
    - "+.229929605.xyz"
    - "+.bytecloudapp.com"
    - "+.ts.net"

proxies: ~

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
      - __ALL_PROXIES__

  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - __ALL_PROXIES__

  - name: 🤖 AI
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - __ALL_PROXIES__

  - name: ⬇️ 大流量
    type: select
    proxies:
      - ♻️ 自动选择
      - 🚀 节点选择
      - DIRECT
      - __ALL_PROXIES__

  - name: 🇯🇵 日本
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 60
    lazy: true
    proxies:
      - 日本01-Hy
      - 日本01

rules:
  # 局域网 / 私有地址
  - RULE-SET,private,DIRECT

  # 防误杀白名单（必须排在广告拦截前）
  - RULE-SET,unban,DIRECT

  # 广告 list，替代 GEOSITE,category-ads-all
  - RULE-SET,ad,REJECT
  - RULE-SET,program-ad,REJECT

  # BT/P2P 下载防封直连
  - RULE-SET,download,DIRECT

  # Windows / Microsoft Update
  - RULE-SET,windows-update,DIRECT

  # 大流量（必须在 Google 之前，避免 googlevideo.com 提前被 Google 匹配）
  - RULE-SET,traffic-heavy,⬇️ 大流量

  # Google 规则
  - RULE-SET,google,🚀 节点选择

  # AI 规则
  - RULE-SET,ai,🤖 AI

  # Bing / Microsoft 365 / 账号
  - RULE-SET,microsoft,🚀 节点选择

  # GitHub 规则
  - RULE-SET,github,🚀 节点选择

  # Telegram 规则
  - RULE-SET,telegram,🚀 节点选择

  # 银行网站直连
  - RULE-SET,bank,DIRECT

  # 海外机酒预订直连
  - RULE-SET,travel-direct,DIRECT

  # Apple 核心与认证服务直连
  - RULE-SET,apple,DIRECT

  # DMM / FANZA
  - RULE-SET,dmm,🇯🇵 日本

  # 额外直连
  - RULE-SET,direct,DIRECT

  # 额外代理
  - RULE-SET,proxy,🚀 节点选择

  # 中国域名直连（远端 list，避免依赖 GeoSite 数据集）
  - RULE-SET,cn-domain,DIRECT

  # 中国 IP 直连
  - GEOIP,CN,DIRECT

  # 兜底代理
  - MATCH,🚀 节点选择

