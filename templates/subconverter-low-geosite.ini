[custom]
; 自用分流规则 - 低 GeoSite 依赖版
; 广告改用 ACL4SSR 的 .list；专用规则使用本仓库维护的 .list
; 中国域名改用 ChinaDomain.list；其余域名由 GEOIP,CN 与 FINAL 兜底，不依赖 GeoSite
; 规则按从上到下首次命中：专用策略必须放在通用中国域名 / GeoIP 规则之前

; 私有地址
ruleset=DIRECT,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/private.list
; 防误杀白名单（必须在广告拦截前）
ruleset=DIRECT,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/unban.list
; 广告拦截（使用 list，替代 geosite:category-ads-all）
ruleset=REJECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=REJECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
; BT/P2P 下载防封
ruleset=DIRECT,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/download.list
; Windows / Microsoft Update（DO 控制面应直连；其余更新默认直连以避免 WinHTTP / Range 问题）
ruleset=DIRECT,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/windows-update.list
; 大流量（必须放在 Google 前，避免 Google 规则提前匹配）
ruleset=⬇️ 大流量,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/traffic-heavy.list
; Google & Gemini
ruleset=🚀 节点选择,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/google.list
; AI 平台
ruleset=🤖 AI,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/ai.list
; Bing / Microsoft 365 / 账号（必须放在 AI 后，让 Copilot 优先命中 AI）
ruleset=🚀 节点选择,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/microsoft.list
; GitHub
ruleset=🚀 节点选择,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/github.list
; Telegram
ruleset=🚀 节点选择,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/telegram.list
; 银行网站（默认直连）
ruleset=DIRECT,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/bank.list
; 海外机酒预订与会员服务（保持中国大陆直连）
ruleset=DIRECT,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/travel-direct.list
; Apple 核心与认证服务（Apple ID / iCloud / App Store / APNs 等，系统更新在大流量组先行匹配）
ruleset=DIRECT,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/apple.list
; DMM / FANZA（必须放在中国域名与 FINAL 兜底前）
ruleset=🇯🇵 日本,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/dmm.list
; 额外直连补充
ruleset=DIRECT,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/direct.list
; 通用代理补充
ruleset=🚀 节点选择,https://raw.githubusercontent.com/coolxll/proxy-routing/main/rules/proxy.list
; 中国域名直连（远端 list，避免依赖 GeoSite 数据集）
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
; 中国 IP 直连（放在所有域名规则之后，避免抢先命中）
ruleset=DIRECT,[]GEOIP,CN
; 兜底
ruleset=🚀 节点选择,[]FINAL

custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🤖 AI`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=⬇️ 大流量`select`[]♻️ 自动选择`[]🚀 节点选择`[]DIRECT`.*
custom_proxy_group=🇯🇵 日本`url-test`(日本|Japan|JP|东京|大阪)`http://www.gstatic.com/generate_204`300,,50

enable_rule_generator=true
overwrite_original_rules=true
